name: Release

# Build and publish to PyPI when a version tag is pushed.
#
# Publishing uses PyPI Trusted Publishing (OIDC) — there is no API token to
# store. Before the first release, register this repository + the `publish`
# job's `pypi` environment as a trusted publisher at
# https://pypi.org/manage/account/publishing/ and create a GitHub environment
# named `pypi` on this repo.

on:
  push:
    tags:
      - "v*"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build distributions
        run: python -m pip install --upgrade pip build twine && python -m build
      - name: Check distribution metadata
        run: python -m twine check dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write  # required for Trusted Publishing (OIDC)
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
