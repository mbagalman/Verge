[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "project-verge"
version = "0.1.0"
description = "Estimate whether a positive growth series is better explained by exponential or logistic growth."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [
  { name = "Michael Bagalman" }
]
keywords = ["growth-curves", "logistic-growth", "exponential-growth", "time-series", "model-selection"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Information Analysis",
]
dependencies = [
  "numpy>=1.23",
  "scipy>=1.10",
]

[project.urls]
Homepage = "https://github.com/mbagalman/Verge"
Repository = "https://github.com/mbagalman/Verge"
Issues = "https://github.com/mbagalman/Verge/issues"

[project.optional-dependencies]
plot = [
  "matplotlib>=3.7",
]
dev = [
  "pytest>=8.0",
  "ruff>=0.5.0",
  "matplotlib>=3.7",
]

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
